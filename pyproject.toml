[project]
name = "group5-project-bzan545"
version = "0.2.0"
description = "Automated daily orders ingestion and store-weather enrichment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1,<2",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
bzan545 = "bzan545.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
