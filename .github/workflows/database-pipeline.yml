name: UTK database pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utk-database-pipeline
  cancel-in-progress: false

jobs:
  rebuild-analytics:
    runs-on: [self-hosted, windows, x64, utk-vpn]
    timeout-minutes: 30
    env:
      BZAN_DB_USERNAME: ${{ secrets.BZAN_DB_USERNAME }}
      BZAN_DB_PASSWORD: ${{ secrets.BZAN_DB_PASSWORD }}
      BZAN_DB_DATABASE: ${{ vars.BZAN_DB_DATABASE || 'ltk528_bzan545' }}
      BZAN_DB_HOST: ${{ vars.BZAN_DB_HOST || 'mariadb-compx0.oit.utk.edu' }}

    steps:
      - name: Check out the latest orders data
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Synchronize missing weather data
        run: bzan545 weather-backfill

      - name: Rebuild and publish analytics
        run: bzan545 rebuild

      - name: Commit validated analytics outputs
        shell: pwsh
        run: |
          git add -- `
            data/silver/order_lines.csv `
            data/gold/group5_rto_daily_sales_weather.csv `
            data/gold/daily_sales_validation.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No analytics changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild database analytics"
          git pull --rebase origin main
          git push origin main
