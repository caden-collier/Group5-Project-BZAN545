name: Preserve daily orders

on:
  schedule:
    # 10:30 PM and 11:30 PM Eastern during daylight-saving time.
    # The second run is a safe retry; identical captures make no changes.
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-daily-orders
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestion safety tests
        run: python -m unittest discover -s tests -v

      - name: Download, validate, hash, and preserve orders
        run: python src/preserve_daily_orders.py

      - name: Commit a new daily capture
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/raw/orders)" ]]; then
            echo "This order date is already preserved."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw/orders
          git commit -m "Preserve daily orders"
          git push
