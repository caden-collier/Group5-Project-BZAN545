name: Daily data pipeline

on:
  schedule:
    # Avoid the top-of-hour Actions queue. Retry again an hour later.
    - cron: "17 12 * * *"
      timezone: "America/New_York"
    - cron: "17 13 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      # UTK MariaDB is not reachable from GitHub-hosted runners. Weather is
      # synchronized separately from a UTK-connected machine.
      - name: Run daily orders ingestion
        id: pipeline
        shell: bash
        run: |
          # The instructor's current-orders URL can briefly return 404 while
          # the new daily file is being published. Retry that transient window
          # without hiding a sustained outage or invalid file.
          for attempt in 1 2 3; do
            if bzan545 daily --skip-weather; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Orders are not available yet; retrying in 5 minutes."
              sleep 300
            fi
          done

          echo "Orders ingestion failed after 3 attempts."
          exit 1

      - name: Commit generated data updates
        if: always()
        shell: bash
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve new bronze orders and ingestion evidence,
          # even if weather or analytics fails afterward.
          git add -- \
            data/bronze/orders \
            data/bronze/ingestion_log.csv

          # Only stage silver and gold when the complete
          # daily pipeline finished successfully.
          if [[ "$PIPELINE_OUTCOME" == "success" ]]; then
            git add -- \
              data/silver/order_lines.csv \
              data/gold/group5_rto_daily_sales_weather.csv \
              data/gold/daily_sales_validation.json
          fi

          if git diff --cached --quiet; then
            echo "No new repository data to commit."
            exit 0
          fi

          git commit -m "Update daily data pipeline"
          git pull --rebase origin main
          git push
