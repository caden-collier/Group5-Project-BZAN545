name: Daily data pipeline

on:
  schedule:
    # Off-peak minutes reduce scheduler delays. The second run is a safe retry.
    - cron: "0 12 * * *"
      timezone: "America/New_York"
    - cron: "0 13 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BZAN_DB_USERNAME: ${{ secrets.BZAN_DB_USERNAME }}
      BZAN_DB_PASSWORD: ${{ secrets.BZAN_DB_PASSWORD }}
      BZAN_DB_DATABASE: ${{ vars.BZAN_DB_DATABASE || 'ltk528_bzan545' }}
      BZAN_DB_HOST: ${{ vars.BZAN_DB_HOST || 'mariadb-compx0.oit.utk.edu' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Ingest orders, update the log, and sync weather
        run: bzan545 daily

      - name: Commit orders and ingestion log updates
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/bronze/orders data/bronze/ingestion_log.csv)" ]]; then
            echo "No new repository data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bronze/orders data/bronze/ingestion_log.csv
          git commit -m "Update daily data pipeline"
          git push
