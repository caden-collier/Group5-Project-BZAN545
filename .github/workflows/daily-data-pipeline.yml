name: Daily data pipeline

on:
  schedule:
    # Off-peak minutes reduce scheduler delays. The second run is a safe retry.
    - cron: "37 22 * * *"
      timezone: "America/New_York"
    - cron: "37 23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      # UTK MariaDB is not reachable from GitHub-hosted runners. Weather is
      # synchronized separately from a UTK-connected machine.
      - name: Ingest orders and update the log
        run: bzan545 daily --skip-weather

      - name: Commit orders and ingestion log updates
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/raw/orders data/logs/ingestion_log.csv)" ]]; then
            echo "No new repository data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw/orders data/logs/ingestion_log.csv
          git commit -m "Update daily data pipeline"
          git pull --rebase origin main
          git push
