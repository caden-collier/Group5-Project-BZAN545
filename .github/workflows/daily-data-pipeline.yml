name: Daily orders ingestion

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-orders
  cancel-in-progress: false

jobs:
  ingest-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download today's orders
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bzan545 ingest; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Orders are not available yet; retrying in 5 minutes."
              sleep 300
            fi
          done

          echo "Orders ingestion failed after 3 attempts."
          exit 1

      - name: Commit orders and ingestion log
        if: always()
        shell: bash
        run: |
          git add -- \
            data/bronze/orders \
            data/bronze/ingestion_log.csv

          if git diff --cached --quiet; then
            echo "No new orders data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily orders data"
          git pull --rebase origin main
          git push origin main
